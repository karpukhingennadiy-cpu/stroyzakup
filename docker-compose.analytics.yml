version: "3.9"

services:
  posthog:
    image: posthog/posthog:latest
    environment:
      IS_BEHIND_PROXY: "true"
      TRUSTED_PROXIES: "*"
      SITE_URL: https://analytics.минитендер.рф
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-change-me-in-production}
      DATABASE_URL: postgres://posthog:posthog@posthog-db:5432/posthog
      REDIS_URL: redis://posthog-redis:6379/
      DISABLE_SECURE_SSL_REDIRECT: "true"
      OPT_OUT_CAPTURE: "false"
    depends_on:
      - posthog-db
      - posthog-redis
    ports:
      - "8001:8000"
    restart: unless-stopped

  posthog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: ${POSTHOG_DB_PASSWORD:-change-me}
      POSTGRES_DB: posthog
    volumes:
      - posthog_data:/var/lib/postgresql/data
    restart: unless-stopped

  posthog-redis:
    image: redis:7-alpine
    volumes:
      - posthog_redis:/data
    restart: unless-stopped

volumes:
  posthog_data:
  posthog_redis:
