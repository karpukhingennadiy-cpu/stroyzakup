version: "3.9"

# ВНИМАНИЕ: этого минимального контура НЕдостаточно для posthog/posthog:latest —
# веб-сервер не стартует без ClickHouse (migrate_clickhouse падает с
# "host 'clickhouse' not known"). Проверено при локальном deploy 2026-08-04.
# Полный self-hosted стек требует ClickHouse + Kafka + plugin-server + worker
# (см. posthog.com/self-host или PostHog Cloud: POSTHOG_HOST=https://app.posthog.com).
# Этот файл оставлен как основа; запуск полного стека — отдельная задача.

services:
  posthog:
    image: posthog/posthog:latest
    environment:
      IS_BEHIND_PROXY: "true"
      TRUSTED_PROXIES: "*"
      SITE_URL: ${POSTHOG_SITE_URL:-http://localhost:8001}
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-change-me-in-production}
      # Пароль БД привязан к POSTHOG_DB_PASSWORD (был hardcoded 'posthog' — auth fail)
      DATABASE_URL: postgres://posthog:${POSTHOG_DB_PASSWORD:-posthog}@posthog-db:5432/posthog
      REDIS_URL: redis://posthog-redis:6379/
      DISABLE_SECURE_SSL_REDIRECT: "true"
      OPT_OUT_CAPTURE: "false"
    depends_on:
      - posthog-db
      - posthog-redis
    ports:
      - "8001:8000"
    restart: unless-stopped

  posthog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: ${POSTHOG_DB_PASSWORD:-change-me}
      POSTGRES_DB: posthog
    volumes:
      - posthog_data:/var/lib/postgresql/data
    restart: unless-stopped

  posthog-redis:
    image: redis:7-alpine
    volumes:
      - posthog_redis:/data
    restart: unless-stopped

volumes:
  posthog_data:
  posthog_redis:
