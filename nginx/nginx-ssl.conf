# nginx/nginx-ssl.conf — Production Nginx с SSL (Let's Encrypt)
# =============================================================================
# Этот файл заменяет nginx/nginx.conf для production-деплоя.
# Перед использованием: запустите certbot (см. deploy/nginx-setup.sh).
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstreams (имена сервисов из docker-compose.prod.yml)
    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:3000;
    }

    # -------------------------------------------------------------------------
    # HTTP (порт 80) — редирект на HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name минитендер.рф www.минитендер.рф xn--h1alffa9f.xn--p1ai www.xn--h1alffa9f.xn--p1ai;

        # Let's Encrypt challenge (certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Все остальные запросы → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS (порт 443) — основной сервер
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name минитендер.рф www.минитендер.рф xn--h1alffa9f.xn--p1ai www.xn--h1alffa9f.xn--p1ai;

        client_max_body_size 20M;

        # SSL-сертификаты (пути после certbot)
        ssl_certificate /etc/letsencrypt/live/минитендер.рф/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/минитендер.рф/privkey.pem;

        # Современные TLS-настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---------------------------------------------------------------------
        # API — прокси на Django backend
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ---------------------------------------------------------------------
        # Admin — прокси на Django backend
        # ---------------------------------------------------------------------
        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # Static / Media (сервирует Nginx напрямую для производительности)
        # ---------------------------------------------------------------------
        location /static/ {
            alias /app/static/;
            expires 30d;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
        }

        # ---------------------------------------------------------------------
        # Frontend (Next.js) — всё остальное
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
