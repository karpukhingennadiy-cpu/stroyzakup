events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    upstream backend { server backend:8000; }
    upstream frontend { server frontend:3000; }

    server {
        listen 80;
        server_name minitender.ru xn--d1abbjawic3ap.xn--p1ai;
        client_max_body_size 20M;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
        location /static/ { alias /app/static/; expires 30d; }
        location /media/ { alias /app/media/; expires 7d; }
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # G4: внутренний endpoint метрик для nginx-prometheus-exporter.
    # Не публикуется наружу (порт 8080 не проброшен на хост).
    server {
        listen 8080;
        server_name _;

        location /stub_status {
            stub_status on;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
