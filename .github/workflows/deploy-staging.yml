name: Staging Deploy

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stroyzakup-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stroyzakup-frontend

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:staging
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,scope=backend-staging,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:staging
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,scope=frontend-staging,mode=max

  deploy:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # STAGING SSH DEPLOY — требует настройки secrets:
      #   STAGING_HOST       — IP или домен staging-сервера
      #   STAGING_USER       — имя пользователя SSH (например, root или deploy)
      #   STAGING_SSH_KEY    — приватный ключ SSH (весь PEM)
      # ------------------------------------------------------------------
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/minitender

            echo "[deploy] Pulling latest staging images..."
            docker compose -f docker-compose.prod.yml pull backend frontend

            echo "[deploy] Restarting services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "[deploy] Running migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput

            echo "[deploy] Collecting static files..."
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput

            echo "[deploy] Health check..."
            for i in {1..12}; do
              if curl -sf http://localhost/api/health/ > /dev/null; then
                echo "[deploy] Backend is healthy."
                break
              fi
              echo "[deploy] Waiting for backend... ($i/12)"
              sleep 5
            done

            echo "[deploy] Staging deploy finished."

      # Fallback / notification placeholder (опционально: добавить Slack/Telegram)
      # - name: Notify on success
      #   run: echo "Staging deploy succeeded"
