name: Backend CI

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: django-insecure-test-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies (including dev extras)
        run: |
          cd backend
          uv sync --extra dev

      - name: Run migrations
        run: |
          cd backend
          uv run python manage.py migrate

      - name: Run tests
        run: |
          cd backend
          uv run pytest tests/ -v --tb=short

      - name: Lint with ruff
        run: |
          cd backend
          uv run ruff check .

      - name: Format check with black
        run: |
          cd backend
          uv run black --check .
