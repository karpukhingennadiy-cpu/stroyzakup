version: "3.9"

# Все сервисы — в именованной сети minitender-net, чтобы
# контур мониторинга (docker-compose.monitoring.yml) мог подключиться к ней как external.
networks:
  minitender-net:
    name: minitender-net

services:
  db:
    image: postgis/postgis:16-3.4
    networks:
      - minitender-net
    environment:
      POSTGRES_DB: ${DB_NAME:-minitender}
      POSTGRES_USER: ${DB_USER:-minitender}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-minitender}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-minitender}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - minitender-net
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    networks:
      - minitender-net
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-minitender}
      DB_USER: ${DB_USER:-minitender}
      DB_PASSWORD: ${DB_PASSWORD:-minitender}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DADATA_TOKEN: ${DADATA_TOKEN:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      YANDEX_GEOCODER_KEY: ${YANDEX_GEOCODER_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      # FIX: без этого config/celery.py шлёт result backend на
      # redis://localhost:6379/1 (внутри контейнера пуст) → 500 при .delay()
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SECRET_KEY: ${SECRET_KEY}
      # 'backend' нужен для scrape Prometheus (/metrics) внутри сети
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
    command: celery -A config worker -l info
    networks:
      - minitender-net
    # Образ наследует HTTP-healthcheck backend Dockerfile (порт 8000),
    # в воркере веб-сервера нет — заменяем на celery ping
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-minitender}
      DB_USER: ${DB_USER:-minitender}
      DB_PASSWORD: ${DB_PASSWORD:-minitender}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DADATA_TOKEN: ${DADATA_TOKEN:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      YANDEX_GEOCODER_KEY: ${YANDEX_GEOCODER_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    networks:
      - minitender-net
    environment:
      NEXT_PUBLIC_API_URL: /api
      # Server-side rewrite target for /api/* (see next.config.ts rewrites)
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    networks:
      - minitender-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  static_volume:
  media_volume:
