services:
  backend:
    build: ./backend
    command: gunicorn config.wsgi --bind 0.0.0.0:8000
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
  postgres:
    image: postgis/postgis:16-3.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:80"]

    environment:
      POSTGRES_DB: minitender
      POSTGRES_USER: minitender
      POSTGRES_PASSWORD: 
