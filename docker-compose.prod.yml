services:
  backend:
    build: ./backend
    command: gunicorn config.wsgi --bind 0.0.0.0:8000
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
  postgres:
    image: postgis/postgis:16-3.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:80"]

    environment:
      POSTGRES_DB: minitender
      POSTGRES_USER: minitender
      POSTGRES_PASSWORD: 

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "minitender"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
