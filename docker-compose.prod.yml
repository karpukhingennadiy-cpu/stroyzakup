version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:-minitender}
      POSTGRES_USER: ${DB_USER:-minitender}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-minitender}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-minitender}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-minitender}
      DB_USER: ${DB_USER:-minitender}
      DB_PASSWORD: ${DB_PASSWORD:-minitender}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DADATA_TOKEN: ${DADATA_TOKEN:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      GEOCODER_API_KEY: ${GEOCODER_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SECRET_KEY: ${SECRET_KEY}
      USE_CELERY: ${USE_CELERY:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-minitender}
      DB_USER: ${DB_USER:-minitender}
      DB_PASSWORD: ${DB_PASSWORD:-minitender}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DADATA_TOKEN: ${DADATA_TOKEN:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      GEOCODER_API_KEY: ${GEOCODER_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      USE_CELERY: ${USE_CELERY:-true}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_2GIS_KEY: 
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  static_volume:
  media_volume:
