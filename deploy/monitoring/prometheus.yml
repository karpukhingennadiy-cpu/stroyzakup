# G4: Prometheus scrape-конфигурация — контур Минитендер.
# Все цели доступны внутри docker-сети minitender-net.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: minitender
    env: production

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Django backend — endpoint /metrics (django-prometheus)
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Хост: CPU / RAM / диск
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # PostgreSQL (PostGIS)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Nginx (stub_status -> nginx-prometheus-exporter)
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Очереди Celery (broker Redis)
  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]
